name: Bike Demand CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bike-demand
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q -m infra

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bike-demand
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          python-version: "3.12"
      - name: Build and run the clean image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test -z "$(git status --porcelain)"
          revision="$(git rev-parse HEAD)"
          tag="bike-demand-lab3:ci"
          docker build --build-arg "SOURCE_REVISION=$revision" --pull --no-cache --progress=plain -t "$tag" . 2>&1 | tee reports/lab3-build.log
          docker image inspect "$tag" --format '{{.Id}}' | tee reports/lab3-image-id.txt
          docker image inspect "$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | tee reports/lab3-image-revision.txt
          test "$(cat reports/lab3-image-revision.txt)" = "$revision"
          docker run --rm "$tag" > reports/lab3-run-1.log 2>&1
          cat reports/lab3-run-1.log
          docker run --rm "$tag" > reports/lab3-run-2.log 2>&1
          cat reports/lab3-run-2.log
          docker run --rm --entrypoint uv "$tag" run --locked pytest -q > reports/lab3-tests.log 2>&1
          cat reports/lab3-tests.log
      - name: Verify the locked sync rejects a stale lock
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          cp pyproject.toml uv.lock .python-version README.md "$probe/"
          python - "$probe/pyproject.toml" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = 'version = "0.1.0"'
          if old not in text:
              raise SystemExit("Could not find the expected disposable version string")
          path.write_text(text.replace(old, 'version = "0.1.1"', 1))
          PY
          if (cd "$probe" && uv sync --locked --no-install-project) > reports/lab3-stale-lock-probe.log 2>&1; then
            cat reports/lab3-stale-lock-probe.log
            echo "Stale lock unexpectedly passed"
            exit 1
          fi
          cat reports/lab3-stale-lock-probe.log
          grep -Eiq 'lockfile needs to be updated|lock file.*update|lock.*out of date' reports/lab3-stale-lock-probe.log
      - name: Upload raw Lab 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-container-evidence-${{ github.sha }}
          path: |
            bike-demand/reports/lab3-build.log
            bike-demand/reports/lab3-image-id.txt
            bike-demand/reports/lab3-image-revision.txt
            bike-demand/reports/lab3-run-1.log
            bike-demand/reports/lab3-run-2.log
            bike-demand/reports/lab3-tests.log
            bike-demand/reports/lab3-stale-lock-probe.log
          if-no-files-found: warn
          retention-days: 30
