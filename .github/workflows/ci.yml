name: Bike Demand CI

on:
  push:
    paths-ignore:
      - "bike-demand/reports/lab-03.md"
      - "bike-demand/reports/lab3-*.log"
      - "bike-demand/reports/lab3-image-*.txt"
  pull_request:
    paths-ignore:
      - "bike-demand/reports/lab-03.md"
      - "bike-demand/reports/lab3-*.log"
      - "bike-demand/reports/lab3-image-*.txt"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bike-demand
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q -m infra

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bike-demand
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          python-version: "3.12"
      - name: Build image and run container tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test -z "$(git status --porcelain)"
          revision="$(git rev-parse HEAD)"
          tag="bike-demand-lab4:ci"
          docker build --build-arg "SOURCE_REVISION=$revision" --pull --no-cache --progress=plain -t "$tag" . 2>&1 | tee reports/lab4-build.log
          docker image inspect "$tag" --format '{{.Id}}' | tee reports/lab4-image-id.txt
          docker image inspect "$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | tee reports/lab4-image-revision.txt
          test "$(cat reports/lab4-image-revision.txt)" = "$revision"
          if docker run --rm --entrypoint uv "$tag" run --locked pytest -q > reports/lab4-tests.log 2>&1; then
            test_status=0
          else
            test_status=$?
          fi
          cat reports/lab4-tests.log
          test "$test_status" -eq 0
          docker run -d --rm --name bike-demand-api -p 127.0.0.1:8000:8000 "$tag" > reports/lab4-api-container-id.txt
          trap 'docker stop bike-demand-api >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > reports/lab4-health.json; then break; fi
            sleep 1
          done
          curl --fail --silent -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' --data '{"season":1,"yr":0,"mnth":1,"hr":0,"holiday":0,"weekday":6,"workingday":0,"weathersit":1,"temp":0.24,"atemp":0.28,"hum":0.81,"windspeed":0}' | tee reports/lab4-predict.json
      - name: Verify the locked sync rejects a stale lock
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          cp pyproject.toml uv.lock .python-version README.md "$probe/"
          python - "$probe/pyproject.toml" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = 'version = "0.1.0"'
          if old not in text:
              raise SystemExit("Could not find the expected disposable version string")
          path.write_text(text.replace(old, 'version = "0.1.1"', 1))
          PY
          if (cd "$probe" && uv sync --locked --no-install-project) > reports/lab3-stale-lock-probe.log 2>&1; then
            cat reports/lab3-stale-lock-probe.log
            echo "Stale lock unexpectedly passed"
            exit 1
          fi
          cat reports/lab3-stale-lock-probe.log
          grep -Eiq 'lockfile.*needs to be updated|lock file.*update|lock.*out of date' reports/lab3-stale-lock-probe.log
      - name: Upload raw Lab 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-container-evidence-${{ github.sha }}
          path: |
            bike-demand/reports/lab4-*
          if-no-files-found: warn
          retention-days: 90
